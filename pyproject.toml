[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "figrepro"
version = "0.1.0"
description = "Reproduce a raster journal figure as an editable vector figure -- one spec, matplotlib and TikZ backends, pixel-level verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yile Wang" }]
keywords = ["matplotlib", "tikz", "latex", "figure", "reproduction", "vector"]
dependencies = ["numpy", "pillow", "matplotlib", "pymupdf"]

[project.urls]
Homepage = "https://github.com/KarlHeinrich-jpg/figure-repro-kit"

[tool.setuptools]
packages = ["figrepro"]
